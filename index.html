<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI로 포켓몬 찾기</title>
<style>
  :root{
    --cream: #FFF8E1;
    --cream2: #FFF3C4;
    --yellow: #FFD54F;
    --yellow-dark: #FFB300;
    --brown: #6D4C1B;
    --brown-soft: #8D6E33;
    --white: #FFFDF7;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, var(--cream) 0%, var(--cream2) 100%);
    color: var(--brown);
    display:flex;
    justify-content:center;
    padding: 24px 12px 60px;
  }
  .wrap{
    width:100%;
    max-width: 780px;
  }
  header{
    text-align:center;
    margin-bottom: 28px;
  }
  header h1{
    font-size: 2.1rem;
    margin: 0 0 8px;
    color: var(--brown);
  }
  header p{
    font-size: 1.1rem;
    color: var(--brown-soft);
    margin:0;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  @media (max-width: 560px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  .mbti-btn{
    padding: 18px 8px;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 1px;
    border: none;
    border-radius: 16px;
    background: var(--white);
    color: var(--brown);
    box-shadow: 0 3px 0 var(--yellow-dark), 0 4px 10px rgba(141,110,51,0.15);
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .mbti-btn:hover{
    transform: translateY(-3px);
    background: var(--yellow);
  }
  .mbti-btn:active{
    transform: translateY(1px);
    box-shadow: 0 1px 0 var(--yellow-dark);
  }
  .mbti-btn.selected{
    background: var(--yellow-dark);
    color: var(--white);
  }

  .result{
    display:none;
    margin-top: 30px;
    animation: fadeIn 0.35s ease;
  }
  .result.show{ display:block; }
  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .card{
    background: var(--white);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 6px 18px rgba(141,110,51,0.18);
    text-align:center;
    border: 3px solid var(--yellow);
  }
  .card .badge{
    display:inline-block;
    background: var(--cream2);
    color: var(--brown-soft);
    font-weight:700;
    font-size: 1rem;
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .emoji-big{
    font-size: 5.5rem;
    line-height:1;
    margin: 6px 0 10px;
  }
  .poke-name{
    font-size: 1.9rem;
    font-weight: 900;
    margin: 0 0 12px;
    color: var(--brown);
  }
  .reasons{
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--brown-soft);
    text-align: left;
    max-width: 480px;
    margin: 0 auto;
    padding-left: 4px;
  }
  .reasons li{ margin-bottom: 6px; }

  .compat{
    margin-top: 22px;
    background: var(--cream2);
    border-radius: 20px;
    padding: 20px 18px;
    text-align:center;
  }
  .compat h3{
    margin: 0 0 10px;
    font-size: 1.15rem;
    color: var(--brown);
  }
  .compat-inner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .compat-emoji{ font-size: 3rem; }
  .compat-text{
    font-size: 1.05rem;
    color: var(--brown-soft);
    max-width: 380px;
    text-align:left;
  }
  .compat-type{
    font-weight: 900;
    color: var(--yellow-dark);
    font-size: 1.2rem;
  }

  .again-btn{
    display:block;
    margin: 26px auto 0;
    padding: 14px 32px;
    font-size: 1.15rem;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    background: var(--yellow-dark);
    color: var(--white);
    cursor: pointer;
    box-shadow: 0 4px 0 #E09400;
    transition: transform 0.12s ease;
  }
  .again-btn:hover{ transform: translateY(-2px); }
  .again-btn:active{
    transform: translateY(2px);
    box-shadow: 0 1px 0 #E09400;
  }

  footer{
    text-align:center;
    margin-top: 40px;
    font-size: 0.85rem;
    color: var(--brown-soft);
    opacity: 0.8;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐣 MBTI로 포켓몬 찾기</h1>
    <p>내 성격 유형을 골라보면, 딱 어울리는 포켓몬을 알려드려요!</p>
  </header>

  <div class="grid" id="mbtiGrid"></div>

  <div class="result" id="resultBox">
    <div class="card">
      <span class="badge" id="badgeType">INTJ</span>
      <div class="emoji-big" id="pokeEmoji">🧠</div>
      <div class="poke-name" id="pokeName">뮤츠</div>
      <ul class="reasons" id="pokeReasons"></ul>
    </div>

    <div class="compat">
      <h3>💛 이런 유형과도 잘 맞아요</h3>
      <div class="compat-inner">
        <div class="compat-emoji" id="compatEmoji">🌈</div>
        <div class="compat-text">
          <span class="compat-type" id="compatType">ENFP</span>
          <div id="compatDesc"></div>
        </div>
      </div>
    </div>

    <button class="again-btn" id="againBtn">🔄 다시 고르기</button>
  </div>

  <footer>재미로 보는 MBTI × 포켓몬 궁합이에요 :)</footer>
</div>

<script>
  const DATA = {
    INTJ: { name:"뮤츠", emoji:"🧠",
      reasons:[
        "치밀한 전략을 세우고 목표를 향해 흔들림 없이 나아가요.",
        "감정보다 논리를 앞세우는 냉철한 판단력이 닮았어요.",
        "혼자 있는 시간 속에서 강한 힘을 키워내는 타입이에요."
      ],
      compat:"ENFP", compatDesc:"자유롭고 따뜻한 ENFP가 INTJ의 세계에 활기를 불어넣어줘요."
    },
    INTP: { name:"로토무", emoji:"💡",
      reasons:[
        "새로운 아이디어와 원리를 파고드는 호기심이 넘쳐요.",
        "기발한 발상으로 예상 못한 해결책을 찾아내요.",
        "혼자만의 연구 시간을 가장 좋아하는 탐구형이에요."
      ],
      compat:"ENTJ", compatDesc:"추진력 강한 ENTJ가 INTP의 아이디어를 현실로 만들어줘요."
    },
    ENTJ: { name:"리자몽", emoji:"🔥",
      reasons:[
        "타고난 카리스마로 무리를 이끄는 리더형이에요.",
        "큰 목표를 향해 거침없이 밀어붙이는 추진력이 있어요.",
        "자신감 넘치는 모습이 불꽃처럼 강렬해요."
      ],
      compat:"INTP", compatDesc:"차분하고 논리적인 INTP가 좋은 참모가 되어줘요."
    },
    ENTP: { name:"메타몽", emoji:"🌀",
      reasons:[
        "상황에 따라 자유자재로 변신하는 순발력이 있어요.",
        "토론과 새로운 아이디어를 즐기는 재기발랄함이 닮았어요.",
        "틀에 갇히지 않는 유연한 사고방식을 가졌어요."
      ],
      compat:"INFJ", compatDesc:"깊이 있는 통찰의 INFJ가 ENTP의 아이디어에 방향을 잡아줘요."
    },
    INFJ: { name:"뮤", emoji:"✨",
      reasons:[
        "신비롭고 깊은 통찰력으로 사람들의 마음을 헤아려요.",
        "이상을 향한 조용하지만 단단한 신념이 있어요.",
        "겉으로는 온화하지만 내면엔 특별한 힘을 품고 있어요."
      ],
      compat:"ENTP", compatDesc:"활발한 ENTP가 INFJ의 생각에 신선한 자극을 줘요."
    },
    INFP: { name:"이브이", emoji:"🦊",
      reasons:[
        "다양한 모습으로 성장할 수 있는 무한한 가능성을 지녔어요.",
        "자기만의 가치관과 감성을 소중히 여겨요.",
        "따뜻하고 순수한 마음으로 주변을 감동시켜요."
      ],
      compat:"ENFJ", compatDesc:"다정한 ENFJ가 INFP의 감성을 편하게 이끌어줘요."
    },
    ENFJ: { name:"피카츄", emoji:"⚡",
      reasons:[
        "밝은 에너지로 주변 사람들을 자연스럽게 이끌어요.",
        "다른 사람의 감정을 세심하게 챙기는 따뜻함이 있어요.",
        "누구에게나 사랑받는 친근한 매력을 가졌어요."
      ],
      compat:"INFP", compatDesc:"섬세한 INFP와 서로의 마음을 깊이 이해해요."
    },
    ENFP: { name:"부스터", emoji:"🔥",
      reasons:[
        "열정 가득한 에너지로 주변을 즐겁게 만들어요.",
        "새로운 일에 망설임 없이 뛰어드는 자유로움이 있어요.",
        "사람을 좋아하고 긍정 에너지가 넘쳐요."
      ],
      compat:"INTJ", compatDesc:"차분한 INTJ가 ENFP의 아이디어에 든든한 중심을 잡아줘요."
    },
    ISTJ: { name:"코일", emoji:"🧲",
      reasons:[
        "규칙과 원칙을 성실하게 지키는 신뢰형이에요.",
        "맡은 일은 끝까지 책임지고 완수해요.",
        "겉보기엔 단단하지만 속은 은근히 다정해요."
      ],
      compat:"ESFP", compatDesc:"자유분방한 ESFP가 ISTJ의 일상에 즐거움을 더해줘요."
    },
    ISFJ: { name:"푸린", emoji:"🎀",
      reasons:[
        "누군가를 조용히 돌보고 챙기는 데 진심이에요.",
        "부드럽고 다정한 태도로 주변을 편안하게 해요.",
        "겉은 여리지만 소중한 것을 지키는 힘이 있어요."
      ],
      compat:"ESTP", compatDesc:"씩씩한 ESTP가 ISFJ에게 새로운 경험을 선물해줘요."
    },
    ESTJ: { name:"괴력몬", emoji:"💪",
      reasons:[
        "체계적으로 조직을 이끄는 강한 실행력이 있어요.",
        "정해진 일은 빠르고 정확하게 처리해요.",
        "든든하고 믿음직한 리더의 모습이 닮았어요."
      ],
      compat:"ISFP", compatDesc:"부드러운 ISFP가 ESTJ의 삶에 여유를 더해줘요."
    },
    ESFJ: { name:"치코리타", emoji:"🌿",
      reasons:[
        "주변 사람들을 살뜰히 챙기는 다정함이 있어요.",
        "함께하는 분위기를 밝고 따뜻하게 만들어요.",
        "누구와도 금세 친해지는 사교성을 가졌어요."
      ],
      compat:"ISTP", compatDesc:"실용적인 ISTP가 ESFJ에게 안정감을 줘요."
    },
    ISTP: { name:"루카리오", emoji:"🥋",
      reasons:[
        "말보다 행동으로 문제를 척척 해결해요.",
        "위기 상황에서도 침착하게 대처하는 능력자예요.",
        "독립적이면서도 자기만의 원칙이 뚜렷해요."
      ],
      compat:"ESFJ", compatDesc:"다정한 ESFJ가 ISTP의 마음을 편하게 열어줘요."
    },
    ISFP: { name:"플로젤", emoji:"💧",
      reasons:[
        "조용하지만 섬세한 감성으로 아름다움을 느껴요.",
        "자기만의 스타일과 취향을 소중히 여겨요.",
        "잔잔하면서도 깊은 매력을 지녔어요."
      ],
      compat:"ESTJ", compatDesc:"든든한 ESTJ가 ISFP의 삶에 안정적인 울타리가 되어줘요."
    },
    ESTP: { name:"윈디", emoji:"🐕",
      reasons:[
        "망설임 없이 바로 행동하는 추진력이 있어요.",
        "모험과 스릴을 즐기는 대담한 성격이에요.",
        "에너지 넘치는 모습이 늠름한 매력을 뽐내요."
      ],
      compat:"ISFJ", compatDesc:"세심한 ISFJ가 ESTP를 든든하게 챙겨줘요."
    },
    ESFP: { name:"라이츄", emoji:"⚡",
      reasons:[
        "타고난 흥과 에너지로 분위기를 즐겁게 만들어요.",
        "사람들 앞에서 빛나는 걸 좋아하는 매력쟁이예요.",
        "즉흥적이고 유쾌한 매력이 넘쳐요."
      ],
      compat:"ISTJ", compatDesc:"차분한 ISTJ가 ESFP의 즉흥성에 균형을 잡아줘요."
    }
  };

  const grid = document.getElementById('mbtiGrid');
  const types = Object.keys(DATA);
  types.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'mbti-btn';
    btn.textContent = t;
    btn.addEventListener('click', () => selectType(t, btn));
    grid.appendChild(btn);
  });

  const resultBox = document.getElementById('resultBox');
  const badgeType = document.getElementById('badgeType');
  const pokeEmoji = document.getElementById('pokeEmoji');
  const pokeName = document.getElementById('pokeName');
  const pokeReasons = document.getElementById('pokeReasons');
  const compatEmoji = document.getElementById('compatEmoji');
  const compatType = document.getElementById('compatType');
  const compatDesc = document.getElementById('compatDesc');

  function selectType(type, btnEl){
    document.querySelectorAll('.mbti-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');

    const info = DATA[type];
    const compatInfo = DATA[info.compat];

    badgeType.textContent = type;
    pokeEmoji.textContent = info.emoji;
    pokeName.textContent = info.name;
    pokeReasons.innerHTML = info.reasons.map(r => `<li>${r}</li>`).join('');

    compatEmoji.textContent = compatInfo.emoji;
    compatType.textContent = info.compat;
    compatDesc.textContent = info.compatDesc;

    resultBox.classList.add('show');
    resultBox.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  document.getElementById('againBtn').addEventListener('click', () => {
    resultBox.classList.remove('show');
    document.querySelectorAll('.mbti-btn').forEach(b => b.classList.remove('selected'));
    window.scrollTo({ top:0, behavior:'smooth' });
  });
</script>
</body>
</html>
